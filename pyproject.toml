[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xphylax"
version = "0.1.0"
description = "xPhylax: real-time Linux log monitoring with UFW-based active response."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [ { name = "xPhylax Team", email = "security@example.com" } ]

[project.scripts]
xphylax = "xphylax.__main__:main"

[project.urls]
Homepage = "https://example.com/xphylax"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
